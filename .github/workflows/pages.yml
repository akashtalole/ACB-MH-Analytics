name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * *"   # daily, 01:17 UTC (06:47 IST)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Refresh FIR / press-release index from acb.maharashtra.gov.in
        run: python scripts/scrape_index.py
      - name: Verify stats tables
        run: python scripts/build_stats.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
